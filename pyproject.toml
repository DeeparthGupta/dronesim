[project]
name = "dronesim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
dronesim = "dronesim:main"

[build-system]
